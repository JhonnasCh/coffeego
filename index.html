<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>CoffeeGo – Cafetería Unisimón</title>
  <meta name="description" content="CoffeeGo: pide tu café, almuerzo o snack en la cafetería de Unisimón sin hacer fila. Recibe tu código QR y recógelo cuando esté listo." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
  <style>
    :root{--c-brown-900:#3b1f0a;--c-brown-800:#5c2e0e;--c-brown-700:#7a3d15;--c-brown-600:#9b5124;--c-orange:#e07b39;--c-cream-100:#fdf6ee;--c-cream-200:#f7eadb;--c-cream-300:#eed9c2;--c-text:#2d1a0e;--c-text-muted:#8b6552;--c-surface:#ffffff;--c-border:#e8d5c0;--c-success:#3d9e6a;--c-warning:#d4a017;--c-error:#c0392b;--c-info:#2980b9;--nav-h:68px;--radius:16px;--shadow:0 4px 24px rgba(59,31,10,.10);--shadow-lg:0 8px 40px rgba(59,31,10,.18);--transition:.22s cubic-bezier(.4,0,.2,1)}
    [data-theme="dark"]{--c-cream-100:#1a0f07;--c-cream-200:#261508;--c-cream-300:#33200f;--c-text:#f5e8d8;--c-text-muted:#b89080;--c-surface:#261508;--c-border:#4a2e18;--shadow:0 4px 24px rgba(0,0,0,.4)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:'Outfit',sans-serif;background:var(--c-cream-100);color:var(--c-text)}
    button{font-family:inherit;cursor:pointer;border:none;background:none}
    input,textarea,select{font-family:inherit}
    #app-shell{max-width:430px;min-height:100dvh;margin:0 auto;background:var(--c-cream-100);display:flex;flex-direction:column;overflow:hidden;position:relative}
    @media(min-width:500px){body{background:#1a0f07}#app-shell{margin:24px auto;min-height:calc(100dvh - 48px);border-radius:36px;box-shadow:0 32px 80px rgba(0,0,0,.6)}}
    #page-content{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav-h) + 8px);scroll-behavior:smooth}
    #page-content::-webkit-scrollbar{width:4px}
    #page-content::-webkit-scrollbar-thumb{background:var(--c-cream-300);border-radius:4px}
    /* TOPBAR */
    #topbar{position:sticky;top:0;z-index:100;background:var(--c-surface);border-bottom:1px solid var(--c-border);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;backdrop-filter:blur(20px)}
    .topbar-logo{display:flex;align-items:center;gap:8px}
    .logo-icon{font-size:22px}
    .logo-name{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--c-brown-700),var(--c-orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .topbar-actions{display:flex;align-items:center;gap:8px}
    .icon-btn{width:38px;height:38px;border-radius:50%;background:var(--c-cream-200);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--c-text);transition:background var(--transition),transform var(--transition)}
    .icon-btn:hover{background:var(--c-cream-300);transform:scale(1.08)}
    #cart-badge{position:relative}
    #cart-badge .badge{position:absolute;top:-2px;right:-2px;background:var(--c-orange);color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--c-surface)}
    .role-pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:linear-gradient(135deg,var(--c-brown-700),var(--c-orange));color:#fff;transition:opacity var(--transition)}
    .role-pill:hover{opacity:.85}
    /* BOTTOM NAV */
    #bottom-nav{position:sticky;bottom:0;z-index:100;background:var(--c-surface);border-top:1px solid var(--c-border);height:var(--nav-h);display:flex;align-items:stretch}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--c-text-muted);padding:6px 4px;cursor:pointer;transition:color var(--transition);position:relative}
    .nav-item .nav-icon{font-size:22px;transition:transform var(--transition)}
    .nav-item.active{color:var(--c-orange)}
    .nav-item.active .nav-icon{transform:translateY(-2px)}
    .nav-item.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:3px;background:var(--c-orange);border-radius:3px 3px 0 0}
    /* VIEWS */
    .view{display:none;animation:fadeIn .25s ease}
    .view.active{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    /* HERO */
    .hero{background:linear-gradient(145deg,var(--c-brown-800) 0%,var(--c-brown-600) 60%,var(--c-orange) 100%);padding:28px 20px 36px;position:relative;overflow:hidden}
    .hero::before{content:'☕';font-size:160px;opacity:.06;position:absolute;right:-20px;bottom:-30px;line-height:1}
    .hero-greeting{font-size:13px;color:rgba(255,255,255,.7);margin-bottom:4px}
    .hero-title{font-size:26px;font-weight:800;color:#fff;margin-bottom:8px}
    .hero-sub{font-size:13px;color:rgba(255,255,255,.7)}
    .hero-ods{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:rgba(255,255,255,.15);padding:5px 12px;border-radius:20px;font-size:11px;color:rgba(255,255,255,.9)}
    /* SEARCH */
    .search-wrap{padding:16px 18px 8px}
    .search-box{display:flex;align-items:center;gap:10px;background:var(--c-surface);border:1.5px solid var(--c-border);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);transition:border-color var(--transition)}
    .search-box:focus-within{border-color:var(--c-orange)}
    .search-box input{flex:1;border:none;outline:none;background:none;font-size:14px;color:var(--c-text)}
    .search-box input::placeholder{color:var(--c-text-muted)}
    .search-icon{font-size:18px;color:var(--c-text-muted)}
    /* CATEGORIES */
    .section-label{font-size:13px;font-weight:700;color:var(--c-text-muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 18px 6px}
    .categories-scroll{display:flex;gap:10px;padding:4px 18px 12px;overflow-x:auto;scroll-snap-type:x mandatory}
    .categories-scroll::-webkit-scrollbar{display:none}
    .cat-chip{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:50px;background:var(--c-cream-200);border:1.5px solid var(--c-border);font-size:13px;font-weight:600;color:var(--c-text-muted);cursor:pointer;transition:all var(--transition);white-space:nowrap}
    .cat-chip .cat-icon{font-size:16px}
    .cat-chip.active,.cat-chip:hover{background:linear-gradient(135deg,var(--c-brown-700),var(--c-orange));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(224,123,57,.35)}
    /* PRODUCT GRID */
    .products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:4px 18px 8px}
    .product-card{background:var(--c-surface);border:1.5px solid var(--c-border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform var(--transition),box-shadow var(--transition);position:relative}
    .product-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
    .product-card.agotado{opacity:.6;pointer-events:none}
    .product-card.agotado::after{content:'AGOTADO';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font-size:13px;font-weight:800;letter-spacing:.1em;border-radius:var(--radius)}
    .product-emoji{font-size:52px;text-align:center;padding:20px 10px 10px;background:var(--c-cream-200);line-height:1}
    .product-info{padding:10px 12px 12px}
    .product-name{font-size:13px;font-weight:700;margin-bottom:2px;line-height:1.3}
    .product-price{font-size:15px;font-weight:800;color:var(--c-orange)}
    .product-available{font-size:10px;color:var(--c-success);font-weight:600;margin-top:2px}
    .add-btn{position:absolute;bottom:10px;right:10px;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--c-brown-700),var(--c-orange));color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(224,123,57,.4);transition:transform var(--transition)}
    .add-btn:hover{transform:scale(1.15)}
    /* SHEET */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
    .overlay.open{display:flex}
    .sheet{background:var(--c-surface);border-radius:24px 24px 0 0;width:100%;max-width:430px;padding:24px 22px 32px;max-height:90dvh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.4,0,.2,1)}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
    .sheet-handle{width:40px;height:4px;background:var(--c-border);border-radius:4px;margin:0 auto 20px}
    .sheet-emoji{font-size:72px;text-align:center;margin-bottom:12px}
    .sheet-name{font-size:22px;font-weight:800;margin-bottom:6px}
    .sheet-desc{font-size:14px;color:var(--c-text-muted);line-height:1.6;margin-bottom:16px}
    .sheet-price{font-size:26px;font-weight:800;color:var(--c-orange);margin-bottom:20px}
    .qty-row{display:flex;align-items:center;gap:16px;margin-bottom:18px}
    .qty-row label{font-size:14px;font-weight:600;flex:1}
    .qty-ctrl{display:flex;align-items:center;gap:12px}
    .qty-btn{width:34px;height:34px;border-radius:50%;background:var(--c-cream-200);border:1.5px solid var(--c-border);font-size:20px;display:flex;align-items:center;justify-content:center;transition:background var(--transition)}
    .qty-btn:hover{background:var(--c-cream-300)}
    .qty-num{font-size:18px;font-weight:700;min-width:24px;text-align:center}
    .note-row{margin-bottom:22px}
    .note-row label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
    .note-row textarea{width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid var(--c-border);background:var(--c-cream-200);font-size:13px;color:var(--c-text);resize:none;outline:none;transition:border-color var(--transition)}
    .note-row textarea:focus{border-color:var(--c-orange)}
    .btn-primary{width:100%;padding:15px;border-radius:14px;background:linear-gradient(135deg,var(--c-brown-700),var(--c-orange));color:#fff;font-size:16px;font-weight:700;box-shadow:0 6px 20px rgba(224,123,57,.4);transition:opacity var(--transition),transform var(--transition)}
    .btn-primary:hover{opacity:.9;transform:translateY(-1px)}
    .btn-secondary{width:100%;padding:13px;border-radius:14px;background:var(--c-cream-200);border:1.5px solid var(--c-border);color:var(--c-text);font-size:15px;font-weight:600;transition:background var(--transition)}
    .btn-secondary:hover{background:var(--c-cream-300)}
    /* CART */
    .cart-header{padding:22px 18px 8px}
    .cart-header h2{font-size:24px;font-weight:800}
    .cart-empty{text-align:center;padding:60px 30px;color:var(--c-text-muted)}
    .cart-empty .empty-emoji{font-size:64px;margin-bottom:16px}
    .cart-empty p{font-size:15px}
    .cart-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--c-border)}
    .cart-item-emoji{font-size:36px}
    .cart-item-info{flex:1}
    .cart-item-name{font-size:14px;font-weight:700}
    .cart-item-note{font-size:11px;color:var(--c-text-muted)}
    .cart-item-price{font-size:14px;font-weight:700;color:var(--c-orange)}
    .cart-item-qty{display:flex;align-items:center;gap:8px;margin-top:6px}
    .cart-qty-btn{width:26px;height:26px;border-radius:50%;background:var(--c-cream-200);border:1.5px solid var(--c-border);font-size:16px;display:flex;align-items:center;justify-content:center;transition:background var(--transition)}
    .cart-qty-btn:hover{background:var(--c-cream-300)}
    .cart-qty-num{font-size:14px;font-weight:700}
    .cart-summary{padding:18px;background:var(--c-surface);border-top:1px solid var(--c-border)}
    .cart-total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .cart-total-label{font-size:15px;font-weight:600}
    .cart-total-val{font-size:22px;font-weight:800;color:var(--c-orange)}
    .pickup-row{margin-bottom:18px}
    .pickup-row label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
    .pickup-row select{width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid var(--c-border);background:var(--c-cream-200);font-size:14px;color:var(--c-text);outline:none;transition:border-color var(--transition)}
    .pickup-row select:focus{border-color:var(--c-orange)}
    .wait-time{font-size:12px;color:var(--c-text-muted);margin-top:6px}
    .wait-time span{color:var(--c-orange);font-weight:700}
    .payment-note{display:flex;align-items:center;gap:8px;background:var(--c-cream-200);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--c-text-muted)}
    /* CONFIRM */
    .confirm-wrap{padding:24px 22px;text-align:center}
    .confirm-icon{font-size:64px;margin-bottom:10px}
    .confirm-title{font-size:24px;font-weight:800;margin-bottom:6px}
    .confirm-sub{font-size:14px;color:var(--c-text-muted);margin-bottom:20px}
    .order-code{display:inline-block;background:linear-gradient(135deg,var(--c-brown-700),var(--c-orange));color:#fff;font-size:28px;font-weight:800;padding:10px 28px;border-radius:12px;margin-bottom:20px;letter-spacing:.08em}
    #qr-container{background:#fff;border-radius:var(--radius);padding:16px;display:inline-block;margin-bottom:20px;box-shadow:var(--shadow)}
    .order-summary{background:var(--c-cream-200);border-radius:14px;padding:16px;text-align:left;margin-bottom:22px}
    .order-summary-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--c-border)}
    .order-summary-row:last-child{border-bottom:none;font-weight:700;font-size:14px}
    .pickup-info{background:var(--c-cream-200);border-radius:14px;padding:14px;margin-bottom:20px;font-size:13px}
    .pickup-info p{margin-bottom:6px}
    .pickup-info strong{color:var(--c-orange)}
    /* STATUS */
    .status-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700}
    .status-recibido{background:#e8f4fd;color:var(--c-info)}
    .status-preparando{background:#fff8e1;color:var(--c-warning)}
    .status-listo{background:#e8f5e9;color:var(--c-success)}
    .status-entregado{background:#f0f0f0;color:#555}
    /* ORDERS */
    .orders-header{padding:22px 18px 8px}
    .orders-header h2{font-size:24px;font-weight:800}
    .order-card{margin:10px 18px;background:var(--c-surface);border:1.5px solid var(--c-border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
    .order-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
    .order-card-id{font-size:16px;font-weight:800}
    .order-card-date{font-size:11px;color:var(--c-text-muted);margin-top:2px}
    .order-card-items{font-size:13px;color:var(--c-text-muted);margin-bottom:10px}
    .order-card-footer{display:flex;justify-content:space-between;align-items:center}
    .order-card-total{font-size:15px;font-weight:800;color:var(--c-orange)}
    .progress-track{display:flex;align-items:center;margin:12px 0}
    .progress-step{flex:1;text-align:center;font-size:10px;font-weight:600;color:var(--c-text-muted);position:relative}
    .progress-step::before{content:'';display:block;width:14px;height:14px;border-radius:50%;background:var(--c-border);margin:0 auto 4px;border:2.5px solid var(--c-border)}
    .progress-step.done::before{background:var(--c-orange);border-color:var(--c-orange)}
    .progress-step:not(:last-child)::after{content:'';position:absolute;top:6px;left:50%;right:-50%;height:2px;background:var(--c-border);z-index:0}
    .progress-step.done:not(:last-child)::after{background:var(--c-orange)}
    /* STAFF */
    .staff-header{background:linear-gradient(135deg,var(--c-brown-900),var(--c-brown-800));padding:22px 18px;color:#fff}
    .staff-header h2{font-size:22px;font-weight:800}
    .staff-header p{font-size:13px;opacity:.7;margin-top:4px}
    .staff-section{padding:16px 18px}
    .staff-section h3{font-size:15px;font-weight:700;margin-bottom:12px;color:var(--c-text-muted);text-transform:uppercase;letter-spacing:.06em}
    .queue-card{background:var(--c-surface);border:1.5px solid var(--c-border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
    .queue-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .queue-card-id{font-size:18px;font-weight:800}
    .queue-card-items{font-size:13px;color:var(--c-text-muted);margin-bottom:12px;line-height:1.6}
    .queue-card-pickup{font-size:12px;font-weight:600;margin-bottom:12px}
    .advance-btn{width:100%;padding:10px;border-radius:10px;background:linear-gradient(135deg,var(--c-brown-700),var(--c-orange));color:#fff;font-size:14px;font-weight:700;transition:opacity var(--transition)}
    .advance-btn:hover{opacity:.88}
    .advance-btn:disabled{opacity:.4;cursor:default}
    /* QR VALIDATOR */
    .qr-validator{padding:24px 22px}
    .qr-validator h3{font-size:18px;font-weight:800;margin-bottom:16px}
    .qr-input-row{display:flex;gap:10px;margin-bottom:16px}
    .qr-input-row input{flex:1;padding:12px 14px;border-radius:12px;border:1.5px solid var(--c-border);background:var(--c-cream-200);font-size:14px;color:var(--c-text);outline:none;transition:border-color var(--transition)}
    .qr-input-row input:focus{border-color:var(--c-orange)}
    .qr-input-row button{padding:12px 18px;border-radius:12px;background:linear-gradient(135deg,var(--c-brown-700),var(--c-orange));color:#fff;font-size:14px;font-weight:700}
    #qr-result{padding:14px;border-radius:12px;font-size:14px;font-weight:600;text-align:center;display:none}
    #qr-result.ok{background:#e8f5e9;color:var(--c-success);display:block}
    #qr-result.err{background:#fdecea;color:var(--c-error);display:block}
    /* PRODUCT MANAGE */
    .product-manage-item{display:flex;align-items:center;gap:12px;background:var(--c-surface);border:1.5px solid var(--c-border);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
    .pmi-emoji{font-size:28px}
    .pmi-info{flex:1}
    .pmi-name{font-size:14px;font-weight:700}
    .pmi-price{font-size:13px;color:var(--c-orange);font-weight:600}
    .pmi-cat{font-size:11px;color:var(--c-text-muted)}
    .pmi-actions{display:flex;gap:6px}
    .pmi-btn{width:32px;height:32px;border-radius:8px;font-size:15px;display:flex;align-items:center;justify-content:center;background:var(--c-cream-200);border:1.5px solid var(--c-border);transition:background var(--transition)}
    .pmi-btn:hover{background:var(--c-cream-300)}
    .pmi-btn.danger{background:#fdecea;border-color:#f5b7b1}
    .pmi-btn.danger:hover{background:#fadbd8}
    /* FORM */
    .form-group{margin-bottom:14px}
    .form-group label{font-size:13px;font-weight:600;display:block;margin-bottom:5px}
    .form-group input,.form-group select{width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid var(--c-border);background:var(--c-cream-200);font-size:14px;color:var(--c-text);outline:none;transition:border-color var(--transition)}
    .form-group input:focus,.form-group select:focus{border-color:var(--c-orange)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
    .toggle-row>label{font-size:14px;font-weight:600}
    .toggle{position:relative;width:44px;height:24px}
    .toggle input{opacity:0;width:0;height:0}
    .toggle-slider{position:absolute;inset:0;background:var(--c-border);border-radius:24px;cursor:pointer;transition:background var(--transition)}
    .toggle-slider::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform var(--transition)}
    .toggle input:checked+.toggle-slider{background:var(--c-orange)}
    .toggle input:checked+.toggle-slider::before{transform:translateX(20px)}
    /* TOAST */
    #toast{position:fixed;bottom:calc(var(--nav-h) + 14px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--c-brown-900);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:all .3s ease;white-space:nowrap;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.3)}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .chip-available{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c-success);margin-right:3px}
    .text-muted{color:var(--c-text-muted);font-size:13px}
    .admin-only{display:none}
  </style>
</head>
<body>
<div id="app-shell">
  <header id="topbar">
    <div class="topbar-logo">
      <span class="logo-icon">☕</span>
      <span class="logo-name">CoffeeGo</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme-btn" title="Cambiar tema">🌙</button>
      <button class="role-pill" id="role-btn">Estudiante</button>
      <button class="icon-btn" id="cart-badge" title="Carrito" onclick="showView('cart')">
        🛒<span class="badge" id="cart-count" style="display:none">0</span>
      </button>
    </div>
  </header>

  <main id="page-content">
    <!-- ===== MENÚ ===== -->
    <section id="view-menu" class="view active">
      <div class="hero">
        <div class="hero-greeting">Hola, Estudiante 👋</div>
        <div class="hero-title">¿Qué quieres hoy?</div>
        <div class="hero-sub">Pide, recoge y disfruta. Sin fila.</div>
        <div class="hero-ods">🎯 ODS 9 — Innovación en la Universidad</div>
      </div>
      <div class="search-wrap">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Buscar producto..." oninput="filterProducts()" />
        </div>
      </div>
      <div class="section-label">Categorías</div>
      <div class="categories-scroll">
        <button class="cat-chip active" onclick="selectCat(this,'Todos')"><span class="cat-icon">🍽️</span>Todos</button>
        <button class="cat-chip" onclick="selectCat(this,'Bebidas calientes')"><span class="cat-icon">☕</span>Calientes</button>
        <button class="cat-chip" onclick="selectCat(this,'Bebidas frías')"><span class="cat-icon">🧋</span>Frías</button>
        <button class="cat-chip" onclick="selectCat(this,'Almuerzos')"><span class="cat-icon">🍱</span>Almuerzos</button>
        <button class="cat-chip" onclick="selectCat(this,'Snacks')"><span class="cat-icon">🫔</span>Snacks</button>
        <button class="cat-chip" onclick="selectCat(this,'Postres')"><span class="cat-icon">🍰</span>Postres</button>
      </div>
      <div class="section-label" id="cat-label">Todos los productos</div>
      <div class="products-grid" id="products-grid"></div>
    </section>

    <!-- ===== CARRITO ===== -->
    <section id="view-cart" class="view">
      <div class="cart-header"><h2>🛒 Mi Carrito</h2></div>
      <div id="cart-list"></div>
      <div id="cart-empty" class="cart-empty" style="display:none">
        <div class="empty-emoji">🛒</div>
        <p>Tu carrito está vacío.<br>¡Agrega algo rico!</p>
      </div>
      <div class="cart-summary" id="cart-summary" style="display:none">
        <div class="cart-total-row">
          <span class="cart-total-label">Total</span>
          <span class="cart-total-val" id="cart-total">$0</span>
        </div>
        <div class="pickup-row">
          <label for="pickup-select">⏰ Hora de recogida</label>
          <select id="pickup-select">
            <option>Lo antes posible</option>
            <option>En 15 minutos</option>
            <option>En 30 minutos</option>
            <option>En 45 minutos</option>
            <option>En 1 hora</option>
          </select>
          <div class="wait-time">Espera estimada: <span id="wait-estimate">~12 min</span></div>
        </div>
        <div class="payment-note">💵 <span>Pago en efectivo al recoger. Sin pagos en línea ni domicilios.</span></div>
        <button class="btn-primary" onclick="placeOrder()">Confirmar pedido ✓</button>
      </div>
    </section>

    <!-- ===== CONFIRMACIÓN ===== -->
    <section id="view-confirm" class="view">
      <div class="confirm-wrap">
        <div class="confirm-icon">🎉</div>
        <div class="confirm-title">¡Pedido confirmado!</div>
        <div class="confirm-sub">Muestra este QR al recoger tu pedido.</div>
        <div class="order-code" id="confirm-order-id">CGO-0000</div>
        <div id="qr-container"></div>
        <div class="order-summary" id="confirm-summary"></div>
        <div class="pickup-info">
          <p>📍 Recoge en el <strong>Mostrador Principal</strong></p>
          <p>⏰ Hora seleccionada: <strong id="confirm-pickup">Lo antes posible</strong></p>
          <p>💵 Pago al recoger en efectivo.</p>
        </div>
        <button class="btn-primary" onclick="showView('orders')">Ver mis pedidos</button>
        <div style="height:12px"></div>
        <button class="btn-secondary" onclick="showView('menu')">Seguir comprando</button>
      </div>
    </section>

    <!-- ===== MIS PEDIDOS ===== -->
    <section id="view-orders" class="view">
      <div class="orders-header"><h2>📋 Mis Pedidos</h2></div>
      <div id="orders-list"></div>
    </section>

    <!-- ===== STAFF: COLA ===== -->
    <section id="view-staff-queue" class="view admin-only">
      <div class="staff-header">
        <h2>🧑‍🍳 Cola de Pedidos</h2>
        <p>Gestiona y avanza el estado de cada orden</p>
      </div>
      <div class="staff-section">
        <h3>Pedidos activos</h3>
        <div id="staff-queue-list"></div>
      </div>
    </section>

    <!-- ===== STAFF: QR ===== -->
    <section id="view-staff-qr" class="view admin-only">
      <div class="staff-header">
        <h2>📷 Validar QR</h2>
        <p>Ingresa el código para marcar la orden como entregada</p>
      </div>
      <div class="qr-validator">
        <h3>Código de orden</h3>
        <div class="qr-input-row">
          <input type="text" id="qr-code-input" placeholder="Ej: CGO-0003" />
          <button onclick="validateQR()">Validar</button>
        </div>
        <div id="qr-result"></div>
        <div style="height:20px"></div>
        <h3>Simulación de escaneo</h3>
        <p class="text-muted" style="margin-bottom:14px">Toca una orden "Listo" para simular el escaneo:</p>
        <div id="qr-sim-list"></div>
      </div>
    </section>

    <!-- ===== STAFF: PRODUCTOS ===== -->
    <section id="view-staff-products" class="view admin-only">
      <div class="staff-header">
        <h2>📦 Gestión de Productos</h2>
        <p>Crea, edita y administra el menú</p>
      </div>
      <div class="staff-section">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <h3 style="margin:0">Productos</h3>
          <button class="btn-primary" style="width:auto;padding:8px 16px;font-size:13px" onclick="openProductForm()">+ Nuevo</button>
        </div>
        <div id="products-manage-list"></div>
      </div>
    </section>
  </main>

  <nav id="bottom-nav">
    <div class="nav-item active" id="nav-menu" onclick="showView('menu')"><span class="nav-icon">🍽️</span><span>Menú</span></div>
    <div class="nav-item" id="nav-cart" onclick="showView('cart')"><span class="nav-icon">🛒</span><span>Carrito</span></div>
    <div class="nav-item" id="nav-orders" onclick="showView('orders')"><span class="nav-icon">📋</span><span>Pedidos</span></div>
    <div class="nav-item admin-only" id="nav-staff-queue" onclick="showView('staff-queue')"><span class="nav-icon">🧑‍🍳</span><span>Cola</span></div>
    <div class="nav-item admin-only" id="nav-staff-qr" onclick="showView('staff-qr')"><span class="nav-icon">📷</span><span>QR</span></div>
    <div class="nav-item admin-only" id="nav-staff-products" onclick="showView('staff-products')"><span class="nav-icon">📦</span><span>Productos</span></div>
  </nav>
</div>

<!-- DETAIL SHEET -->
<div class="overlay" id="detail-overlay" onclick="closeDetail(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-emoji" id="d-emoji"></div>
    <div class="sheet-name" id="d-name"></div>
    <div class="sheet-desc" id="d-desc"></div>
    <div class="sheet-price" id="d-price"></div>
    <div class="qty-row">
      <label>Cantidad</label>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="changeQty(-1)">&#8722;</button>
        <span class="qty-num" id="d-qty">1</span>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
    </div>
    <div class="note-row">
      <label for="d-note">Nota opcional</label>
      <textarea id="d-note" rows="2" placeholder="Ej: sin azúcar, extra leche…"></textarea>
    </div>
    <button class="btn-primary" onclick="addToCart()">Agregar al carrito</button>
  </div>
</div>

<!-- PRODUCT FORM SHEET -->
<div class="overlay" id="product-form-overlay" onclick="closeProductForm(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="product-form-title" style="font-size:20px;font-weight:800;margin-bottom:16px">Nuevo Producto</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Emoji</label>
        <input type="text" id="pf-emoji" placeholder="☕" maxlength="4" />
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select id="pf-cat">
          <option>Bebidas calientes</option>
          <option>Bebidas frías</option>
          <option>Almuerzos</option>
          <option>Snacks</option>
          <option>Postres</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Nombre del producto</label>
      <input type="text" id="pf-name" placeholder="Ej: Café con leche" />
    </div>
    <div class="form-group">
      <label>Descripción</label>
      <input type="text" id="pf-desc" placeholder="Breve descripción" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Precio (COP)</label>
        <input type="number" id="pf-price" placeholder="3500" />
      </div>
      <div class="form-group" style="display:flex;flex-direction:column;justify-content:flex-end">
        <div class="toggle-row">
          <label>Disponible</label>
          <label class="toggle"><input type="checkbox" id="pf-available" checked /><span class="toggle-slider"></span></label>
        </div>
      </div>
    </div>
    <button class="btn-primary" onclick="saveProduct()">Guardar producto</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* DATA */
const PRODUCTS_DEFAULT=[
  {id:1,emoji:'☕',name:'Tinto',desc:'Café negro colombiano, recién colado.',price:1800,cat:'Bebidas calientes',available:true},
  {id:2,emoji:'🍵',name:'Café con leche',desc:'Espresso suave con leche caliente.',price:2500,cat:'Bebidas calientes',available:true},
  {id:3,emoji:'🫖',name:'Aromática',desc:'Infusión de hierbas y canela.',price:1500,cat:'Bebidas calientes',available:true},
  {id:4,emoji:'☕',name:'Capuchino',desc:'Espresso con espuma de leche vaporizada.',price:3800,cat:'Bebidas calientes',available:true},
  {id:5,emoji:'🍫',name:'Chocolate caliente',desc:'Bebida de cacao 100% colombiano.',price:2800,cat:'Bebidas calientes',available:true},
  {id:6,emoji:'🧃',name:'Jugo de lulo',desc:'Jugo natural de lulo con agua o leche.',price:2200,cat:'Bebidas frías',available:true},
  {id:7,emoji:'🍹',name:'Jugo de maracuyá',desc:'Maracuyá fresco, ligeramente dulce.',price:2200,cat:'Bebidas frías',available:true},
  {id:8,emoji:'🧋',name:'Limonada de coco',desc:'Refrescante limonada con crema de coco.',price:3200,cat:'Bebidas frías',available:true},
  {id:9,emoji:'🍵',name:'Té frío de durazno',desc:'Té negro frío con sabor a durazno y menta.',price:2800,cat:'Bebidas frías',available:false},
  {id:10,emoji:'🥛',name:'Avena fría',desc:'Avena molida con panela y canela, bien fría.',price:2000,cat:'Bebidas frías',available:true},
  {id:11,emoji:'🍱',name:'Almuerzo del día',desc:'Sopa, principio, proteína, arroz y jugo.',price:9500,cat:'Almuerzos',available:true},
  {id:12,emoji:'🥗',name:'Ensalada verde',desc:'Lechuga, tomate, zanahoria y aderezo.',price:5000,cat:'Almuerzos',available:true},
  {id:13,emoji:'🍗',name:'Pollo asado',desc:'Pechuga a la plancha con arroz y ensalada.',price:8500,cat:'Almuerzos',available:true},
  {id:14,emoji:'🫘',name:'Frijolada',desc:'Frijoles con chicharrón, platanito y arroz.',price:8000,cat:'Almuerzos',available:false},
  {id:15,emoji:'🥟',name:'Empanadas (x2)',desc:'Rellenas de pollo o carne, con ají.',price:3500,cat:'Snacks',available:true},
  {id:16,emoji:'🧀',name:'Pan de bono',desc:'Pandebono esponjoso, recién horneado.',price:2000,cat:'Snacks',available:true},
  {id:17,emoji:'🫔',name:'Buñuelo',desc:'Buñuelo dorado y crujiente, tipo casero.',price:1500,cat:'Snacks',available:true},
  {id:18,emoji:'🌽',name:'Arepa de choclo',desc:'Arepa dulce de maíz con queso.',price:3000,cat:'Snacks',available:true},
  {id:19,emoji:'🍰',name:'Brownie de chocolate',desc:'Brownie denso con chips de chocolate.',price:3500,cat:'Postres',available:true},
  {id:20,emoji:'🍮',name:'Natilla',desc:'Postre tradicional de maíz y panela.',price:2800,cat:'Postres',available:true},
  {id:21,emoji:'🍪',name:'Galleta de avena',desc:'Galleta artesanal con avena y pasas.',price:1800,cat:'Postres',available:true},
  {id:22,emoji:'🍓',name:'Ensalada de frutas',desc:'Frutas de temporada con crema de leche.',price:3200,cat:'Postres',available:true}
];
const DEMO_ORDERS=[
  {id:'CGO-0001',date:'28/10/2026, 8:45',pickup:'Lo antes posible',items:[{name:'Tinto',qty:1,price:1800},{name:'Pan de bono',qty:2,price:2000}],total:5800,status:'entregado',token:'tok_demo1'},
  {id:'CGO-0002',date:'29/10/2026, 12:10',pickup:'En 30 minutos',items:[{name:'Almuerzo del día',qty:1,price:9500},{name:'Jugo de lulo',qty:1,price:2200}],total:11700,status:'preparando',token:'tok_demo2'}
];

/* STATE */
let products=JSON.parse(localStorage.getItem('cg_products')||'null')||[...PRODUCTS_DEFAULT];
let cart=JSON.parse(localStorage.getItem('cg_cart')||'[]');
let orders=JSON.parse(localStorage.getItem('cg_orders')||'null')||[...DEMO_ORDERS];
let currentRole=localStorage.getItem('cg_role')||'student';
let darkMode=localStorage.getItem('cg_dark')==='true';
let selectedCat='Todos';
let detailProduct=null;
let detailQty=1;
let editingProductId=null;

/* INIT */
function init(){applyTheme();applyRole();renderProducts();renderCart();renderOrders();updateCartBadge();simulateOrderProgress();}

/* THEME */
function applyTheme(){document.documentElement.setAttribute('data-theme',darkMode?'dark':'light');document.getElementById('theme-btn').textContent=darkMode?'☀️':'🌙';}
document.getElementById('theme-btn').addEventListener('click',()=>{darkMode=!darkMode;localStorage.setItem('cg_dark',darkMode);applyTheme();});

/* ROLE */
function applyRole(){
  const isStaff=currentRole==='staff';
  document.getElementById('role-btn').textContent=isStaff?'Personal 🧑‍🍳':'Estudiante';
  document.querySelectorAll('.admin-only').forEach(el=>el.style.display=isStaff?'':'none');
}
document.getElementById('role-btn').addEventListener('click',()=>{
  currentRole=currentRole==='staff'?'student':'staff';
  localStorage.setItem('cg_role',currentRole);
  applyRole();
  showView(currentRole==='staff'?'staff-queue':'menu');
  showToast(currentRole==='staff'?'🧑‍🍳 Modo personal activado':'🎓 Modo estudiante activado');
});

/* VIEWS */
const NAV_MAP={'menu':'nav-menu','cart':'nav-cart','orders':'nav-orders','confirm':null,'staff-queue':'nav-staff-queue','staff-qr':'nav-staff-qr','staff-products':'nav-staff-products'};
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el=document.getElementById('view-'+name);
  if(el)el.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const nid=NAV_MAP[name];
  if(nid){const n=document.getElementById(nid);if(n)n.classList.add('active');}
  document.getElementById('page-content').scrollTo(0,0);
  if(name==='orders')renderOrders();
  if(name==='staff-queue')renderStaffQueue();
  if(name==='staff-qr')renderQRSim();
  if(name==='staff-products')renderProductsManage();
}

/* PRODUCTS */
function renderProducts(){
  const query=(document.getElementById('search-input')?.value||'').toLowerCase();
  const grid=document.getElementById('products-grid');
  const label=document.getElementById('cat-label');
  const filtered=products.filter(p=>{
    const mc=selectedCat==='Todos'||p.cat===selectedCat;
    const mq=!query||p.name.toLowerCase().includes(query)||p.cat.toLowerCase().includes(query);
    return mc&&mq;
  });
  label.textContent=selectedCat==='Todos'?'Todos los productos':selectedCat;
  if(!filtered.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--c-text-muted)"><div style="font-size:48px;margin-bottom:8px">🔍</div><p>No encontramos productos.</p></div>';
    return;
  }
  grid.innerHTML=filtered.map(p=>`
    <div class="product-card${p.available?'':' agotado'}" onclick="openDetail(${p.id})">
      <div class="product-emoji">${p.emoji}</div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-price">${fmtCOP(p.price)}</div>
        <div class="product-available"><span class="chip-available"></span>${p.available?'Disponible':'Agotado'}</div>
      </div>
      ${p.available?`<button class="add-btn" onclick="quickAdd(event,${p.id})">+</button>`:''}
    </div>`).join('');
}
function selectCat(el,cat){document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');selectedCat=cat;renderProducts();}
function filterProducts(){renderProducts();}

/* DETAIL */
function openDetail(id){
  detailProduct=products.find(p=>p.id===id);
  if(!detailProduct)return;
  detailQty=1;
  document.getElementById('d-emoji').textContent=detailProduct.emoji;
  document.getElementById('d-name').textContent=detailProduct.name;
  document.getElementById('d-desc').textContent=detailProduct.desc;
  document.getElementById('d-price').textContent=fmtCOP(detailProduct.price);
  document.getElementById('d-qty').textContent=1;
  document.getElementById('d-note').value='';
  document.getElementById('detail-overlay').classList.add('open');
}
function closeDetail(e){if(e.target===document.getElementById('detail-overlay'))document.getElementById('detail-overlay').classList.remove('open');}
function changeQty(d){detailQty=Math.max(1,detailQty+d);document.getElementById('d-qty').textContent=detailQty;}
function addToCart(){
  if(!detailProduct)return;
  const note=document.getElementById('d-note').value.trim();
  const ex=cart.find(i=>i.id===detailProduct.id&&i.note===note);
  if(ex)ex.qty+=detailQty;
  else cart.push({id:detailProduct.id,emoji:detailProduct.emoji,name:detailProduct.name,price:detailProduct.price,qty:detailQty,note});
  saveCart();updateCartBadge();
  document.getElementById('detail-overlay').classList.remove('open');
  showToast('✅ '+detailProduct.name+' agregado');
}
function quickAdd(e,id){
  e.stopPropagation();
  const p=products.find(x=>x.id===id);
  const ex=cart.find(i=>i.id===p.id&&!i.note);
  if(ex)ex.qty++;
  else cart.push({id:p.id,emoji:p.emoji,name:p.name,price:p.price,qty:1,note:''});
  saveCart();updateCartBadge();showToast('✅ '+p.name+' agregado');
}

/* CART */
function renderCart(){
  const list=document.getElementById('cart-list');
  const empty=document.getElementById('cart-empty');
  const summ=document.getElementById('cart-summary');
  if(!cart.length){list.innerHTML='';empty.style.display='';summ.style.display='none';return;}
  empty.style.display='none';summ.style.display='';
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  list.innerHTML=cart.map((item,idx)=>`
    <div class="cart-item">
      <div class="cart-item-emoji">${item.emoji}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        ${item.note?`<div class="cart-item-note">📝 ${item.note}</div>`:''}
        <div class="cart-item-qty">
          <button class="cart-qty-btn" onclick="cartQty(${idx},-1)">&#8722;</button>
          <span class="cart-qty-num">${item.qty}</span>
          <button class="cart-qty-btn" onclick="cartQty(${idx},1)">+</button>
          <button class="cart-qty-btn" style="margin-left:4px" onclick="removeCartItem(${idx})">🗑️</button>
        </div>
      </div>
      <div class="cart-item-price">${fmtCOP(item.price*item.qty)}</div>
    </div>`).join('');
  document.getElementById('cart-total').textContent=fmtCOP(total);
  const wait=5+orders.filter(o=>['recibido','preparando'].includes(o.status)).length*3+cart.reduce((s,i)=>s+i.qty,0)*2;
  document.getElementById('wait-estimate').textContent='~'+wait+' min';
}
function cartQty(idx,d){cart[idx].qty=Math.max(1,cart[idx].qty+d);saveCart();updateCartBadge();renderCart();}
function removeCartItem(idx){cart.splice(idx,1);saveCart();updateCartBadge();renderCart();}
function saveCart(){localStorage.setItem('cg_cart',JSON.stringify(cart));}
function updateCartBadge(){const t=cart.reduce((s,i)=>s+i.qty,0);const b=document.getElementById('cart-count');b.textContent=t;b.style.display=t?'':'none';}

/* ORDER */
let orderCounter=parseInt(localStorage.getItem('cg_counter')||'2');
function placeOrder(){
  if(!cart.length)return;
  orderCounter++;
  localStorage.setItem('cg_counter',orderCounter);
  const id='CGO-'+String(orderCounter).padStart(4,'0');
  const token='tok_'+Math.random().toString(36).slice(2,10);
  const pickup=document.getElementById('pickup-select').value;
  const newOrder={id,date:new Date().toLocaleString('es-CO'),pickup,items:cart.map(i=>({name:i.name,qty:i.qty,price:i.price})),total:cart.reduce((s,i)=>s+i.price*i.qty,0),status:'recibido',token};
  orders.unshift(newOrder);
  localStorage.setItem('cg_orders',JSON.stringify(orders));
  document.getElementById('confirm-order-id').textContent=id;
  document.getElementById('confirm-pickup').textContent=pickup;
  const qrDiv=document.getElementById('qr-container');
  qrDiv.innerHTML='';
  try{new QRCode(qrDiv,{text:id+'|'+token,width:180,height:180,colorDark:'#3b1f0a',colorLight:'#ffffff'});}catch(e){}
  const sEl=document.getElementById('confirm-summary');
  sEl.innerHTML=newOrder.items.map(i=>`<div class="order-summary-row"><span>${i.name} ×${i.qty}</span><span>${fmtCOP(i.price*i.qty)}</span></div>`).join('')+`<div class="order-summary-row"><span>Total</span><span>${fmtCOP(newOrder.total)}</span></div>`;
  cart=[];saveCart();updateCartBadge();
  showView('confirm');showToast('🎉 Pedido enviado');
}

/* ORDERS */
const SL={recibido:'Recibido',preparando:'Preparando',listo:'Listo ✅',entregado:'Entregado 📦'};
const SS=['recibido','preparando','listo','entregado'];
function renderOrders(){
  const list=document.getElementById('orders-list');
  if(!orders.length){list.innerHTML='<div class="cart-empty"><div class="empty-emoji">📋</div><p>Aún no tienes pedidos.</p></div>';return;}
  list.innerHTML=orders.map(o=>{
    const si=SS.indexOf(o.status);
    const steps=SS.map((s,i)=>`<div class="progress-step${i<=si?' done':''}">${SL[s].split(' ')[0]}</div>`).join('');
    return `<div class="order-card">
      <div class="order-card-head">
        <div><div class="order-card-id">${o.id}</div><div class="order-card-date">${o.date}</div></div>
        <span class="status-pill status-${o.status}">${SL[o.status]}</span>
      </div>
      <div class="progress-track">${steps}</div>
      <div class="order-card-items">${o.items.map(i=>i.name+' ×'+i.qty).join(' · ')}</div>
      <div class="order-card-footer"><span style="font-size:12px;color:var(--c-text-muted)">⏰ ${o.pickup}</span><span class="order-card-total">${fmtCOP(o.total)}</span></div>
    </div>`;
  }).join('');
}

/* STAFF QUEUE */
function renderStaffQueue(){
  const list=document.getElementById('staff-queue-list');
  const active=orders.filter(o=>o.status!=='entregado');
  if(!active.length){list.innerHTML='<div class="text-muted" style="text-align:center;padding:30px">No hay pedidos activos 🎉</div>';return;}
  const ns={recibido:'preparando',preparando:'listo',listo:'entregado'};
  const nl={recibido:'Marcar Preparando',preparando:'Marcar Listo',listo:'Marcar Entregado'};
  list.innerHTML=active.map(o=>`
    <div class="queue-card">
      <div class="queue-card-head"><span class="queue-card-id">${o.id}</span><span class="status-pill status-${o.status}">${SL[o.status]}</span></div>
      <div class="queue-card-items">${o.items.map(i=>'• '+i.name+' ×'+i.qty).join('<br>')}</div>
      <div class="queue-card-pickup">⏰ ${o.pickup} | 📅 ${o.date}</div>
      ${ns[o.status]?`<button class="advance-btn" onclick="advanceOrder('${o.id}','${ns[o.status]}')">${nl[o.status]}</button>`:'<button class="advance-btn" disabled>✅ Completado</button>'}
    </div>`).join('');
}
function advanceOrder(id,s){
  const o=orders.find(x=>x.id===id);
  if(o){o.status=s;localStorage.setItem('cg_orders',JSON.stringify(orders));renderStaffQueue();renderOrders();showToast('📦 '+id+' → '+SL[s]);}
}

/* QR */
function renderQRSim(){
  const list=document.getElementById('qr-sim-list');
  const active=orders.filter(o=>o.status==='listo');
  if(!active.length){list.innerHTML='<div class="text-muted">No hay órdenes listas aún.</div>';return;}
  list.innerHTML=active.map(o=>`
    <div class="queue-card" style="cursor:pointer" onclick="simulateScan('${o.id}')">
      <div class="queue-card-head"><span class="queue-card-id">${o.id}</span><span class="status-pill status-listo">Listo ✅</span></div>
      <p style="font-size:13px;color:var(--c-text-muted)">Toca para simular escaneo QR</p>
    </div>`).join('');
}
function validateQR(){
  const input=document.getElementById('qr-code-input').value.trim().toUpperCase();
  const res=document.getElementById('qr-result');
  const o=orders.find(x=>x.id===input);
  if(!o){res.className='err';res.textContent='❌ Orden no encontrada.';return;}
  if(o.status==='entregado'){res.className='err';res.textContent='⚠️ Esta orden ya fue entregada.';return;}
  if(o.status!=='listo'){res.className='err';res.textContent='⏳ La orden aún no está lista ('+SL[o.status]+').';return;}
  o.status='entregado';
  localStorage.setItem('cg_orders',JSON.stringify(orders));
  res.className='ok';res.textContent='✅ '+o.id+' marcada como entregada.';
  renderStaffQueue();renderOrders();renderQRSim();showToast('🎉 '+o.id+' entregada');
}
function simulateScan(id){document.getElementById('qr-code-input').value=id;validateQR();}

/* PRODUCT MANAGE */
function renderProductsManage(){
  const list=document.getElementById('products-manage-list');
  list.innerHTML=products.map(p=>`
    <div class="product-manage-item">
      <div class="pmi-emoji">${p.emoji}</div>
      <div class="pmi-info">
        <div class="pmi-name">${p.name}</div>
        <div class="pmi-price">${fmtCOP(p.price)}</div>
        <div class="pmi-cat">${p.cat} · ${p.available?'✅ Disponible':'🚫 Agotado'}</div>
      </div>
      <div class="pmi-actions">
        <button class="pmi-btn" onclick="toggleAvail(${p.id})">${p.available?'🚫':'✅'}</button>
        <button class="pmi-btn" onclick="openProductForm(${p.id})">✏️</button>
        <button class="pmi-btn danger" onclick="deleteProduct(${p.id})">🗑️</button>
      </div>
    </div>`).join('');
}
function toggleAvail(id){const p=products.find(x=>x.id===id);if(p){p.available=!p.available;saveProds();renderProductsManage();renderProducts();showToast(p.available?'✅ '+p.name+' disponible':'🚫 '+p.name+' agotado');}}
function deleteProduct(id){if(!confirm('¿Eliminar este producto?'))return;products=products.filter(p=>p.id!==id);saveProds();renderProductsManage();renderProducts();showToast('🗑️ Producto eliminado');}
function openProductForm(id=null){
  editingProductId=id;
  document.getElementById('product-form-title').textContent=id?'Editar Producto':'Nuevo Producto';
  if(id){
    const p=products.find(x=>x.id===id);
    document.getElementById('pf-emoji').value=p.emoji;
    document.getElementById('pf-name').value=p.name;
    document.getElementById('pf-desc').value=p.desc;
    document.getElementById('pf-price').value=p.price;
    document.getElementById('pf-cat').value=p.cat;
    document.getElementById('pf-available').checked=p.available;
  }else{
    ['pf-name','pf-desc','pf-price'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('pf-emoji').value='☕';
    document.getElementById('pf-cat').value='Bebidas calientes';
    document.getElementById('pf-available').checked=true;
  }
  document.getElementById('product-form-overlay').classList.add('open');
}
function closeProductForm(e){if(e.target===document.getElementById('product-form-overlay'))document.getElementById('product-form-overlay').classList.remove('open');}
function saveProduct(){
  const name=document.getElementById('pf-name').value.trim();
  const price=parseInt(document.getElementById('pf-price').value);
  if(!name||isNaN(price)){showToast('⚠️ Completa todos los campos');return;}
  if(editingProductId){
    Object.assign(products.find(x=>x.id===editingProductId),{emoji:document.getElementById('pf-emoji').value||'☕',name,desc:document.getElementById('pf-desc').value,price,cat:document.getElementById('pf-cat').value,available:document.getElementById('pf-available').checked});
    showToast('✅ Producto actualizado');
  }else{
    products.push({id:products.reduce((m,p)=>Math.max(m,p.id),0)+1,emoji:document.getElementById('pf-emoji').value||'☕',name,desc:document.getElementById('pf-desc').value,price,cat:document.getElementById('pf-cat').value,available:document.getElementById('pf-available').checked});
    showToast('✅ Producto creado');
  }
  saveProds();renderProductsManage();renderProducts();
  document.getElementById('product-form-overlay').classList.remove('open');
}
function saveProds(){localStorage.setItem('cg_products',JSON.stringify(products));}

/* AUTO-PROGRESS */
function simulateOrderProgress(){
  setInterval(()=>{
    let changed=false;
    orders.forEach(o=>{if(o.status==='recibido'){o.status='preparando';changed=true;}});
    if(changed){localStorage.setItem('cg_orders',JSON.stringify(orders));renderOrders();if(currentRole==='staff')renderStaffQueue();}
  },15000);
}

/* UTILS */
function fmtCOP(n){return '$'+n.toLocaleString('es-CO');}
let _tt;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2600);}

init();
<\/script>
</body>
</html>
